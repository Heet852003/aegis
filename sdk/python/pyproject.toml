[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-worker-sdk"
version = "0.1.0"
description = "Python worker SDK for Aegis, a distributed job queue and workflow orchestration engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/Heet852003/aegis"

[tool.setuptools.packages.find]
include = ["aegis_sdk*"]
